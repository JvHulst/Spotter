<!doctype html>
<meta charset="utf-8">
<title>Progression tests</title>
<pre id="out">running</pre>
<script type="module">
import { e1rm, planExercise, nextSetWeight, warmupSets, finisherSets, nextTemplateId } from "../js/progression.js";
import { indexByExercise, sessionRecords, stalled, records, muscleShares, weeklyStats, cleanSession, setCount } from "../js/history.js";
import { cleanProgram } from "../js/program.js";
import { parseCsv, strongSessions, splitWeighted } from "../js/strong.js";
import { encrypt, decrypt, deriveKey, stable } from "../js/sync.js";

const results = [];
const check = (name, actual, expected) => {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  results.push(`${ok ? "PASS" : "FAIL"} ${name}${ok ? "" : `\n     expected ${JSON.stringify(expected)}\n     actual   ${JSON.stringify(actual)}`}`);
};

const today = new Date(2026, 9, 29);
const daysAgo = (n) => new Date(today.getTime() - n * 86400000);
const db = { load: "none", increment: 4, equipment: "dumbbell" };
const target = { reps: [5, 8], rir: [1, 2] };
const plan = (ex, sets, gap, nSets = 3, t = target) => planExercise({
  ex, target: t, nSets, today, bodyweight: 90,
  history: sets ? [{ date: daysAgo(gap), sets: sets.map(([kg, reps, rir]) => ({ kg, reps, rir })) }] : [],
});
const brief = (p) => ({ mode: p.mode, kg: p.sets.map((s) => s.kg), reps: p.sets.map((s) => s.reps) });

check("e1rm", Math.round(e1rm(68, 8, 1) * 10) / 10, 88.4);
check("up: all sets at top with RIR >= 1", brief(plan(db, [[68, 8, 1], [68, 8, 1], [68, 8, 2]], 5)),
  { mode: "up", kg: [72, 72, 72], reps: [6, 6, 6] });
check("up: Strong sets without RIR", plan(db, [[68, 8], [68, 8], [68, 8]], 5).mode, "up");
check("reps: one more rep per set", brief(plan(db, [[68, 7, 1], [68, 7, 1], [68, 6, 1]], 5)),
  { mode: "reps", kg: [68, 68, 68], reps: [8, 8, 7] });
check("reps: top reached only at RIR 0", brief(plan(db, [[68, 8, 0], [68, 8, 0], [68, 8, 0]], 5)),
  { mode: "reps", kg: [68, 68, 68], reps: [8, 8, 8] });
check("reps: back-off sets are ignored", brief(plan(db, [[68, 7, 1], [68, 6, 1], [56, 10, 1]], 5)),
  { mode: "reps", kg: [68, 68, 68], reps: [8, 7, 7] });
check("down: below the rep range", brief(plan(db, [[68, 4, 0], [68, 4, 0], [68, 3, 0]], 5)),
  { mode: "down", kg: [64, 64, 64], reps: [5, 5, 5] });
check("return after 4 weeks: same weight, fewer reps", brief(plan(db, [[68, 8, 1], [68, 8, 1], [68, 8, 1]], 28)),
  { mode: "return", kg: [68, 68, 68], reps: [6, 6, 6] });
check("return after 10 months: 18% lighter", brief(plan(db, [[68, 8, 1], [68, 8, 1], [68, 8, 1]], 300)),
  { mode: "return", kg: [56, 56, 56], reps: [8, 8, 8] });
check("new exercise", brief(plan(db, null, 0)), { mode: "new", kg: [null, null, null], reps: [6, 6, 6] });

const assisted = { load: "subtract", increment: 5, equipment: "machine" };
check("assisted: less assistance when progressing", plan(assisted, [[30, 10, 2], [30, 10, 2]], 3, 2, { reps: [6, 10], rir: [1, 2] }).sets[0].kg, 25);
const weighted = { load: "add", increment: 2.5, equipment: "bodyweight" };
check("weighted: more added weight when progressing", plan(weighted, [[10, 10, 1], [10, 10, 1]], 3, 2, { reps: [6, 10], rir: [1, 2] }).sets[0].kg, 12.5);
const calf = { load: "none", increment: 0, equipment: "bodyweight" };
check("increment 0: reps beyond the range", brief(plan(calf, [[0, 20], [0, 20]], 3, 2, { reps: [12, 20], rir: [1, 2] })),
  { mode: "reps", kg: [0, 0], reps: [21, 21] });

const next = (kg, reps, rir, nextSet = { kg: 68, reps: 8 }) =>
  nextSetWeight({ ex: db, target, done: { kg, reps, rir }, plannedReps: 8, next: nextSet, bodyweight: 90 });
check("next set: on target keeps weight", next(68, 8, 1), 68);
check("next set: inside the RIR range keeps weight", next(68, 8, 2), 68);
check("next set: on target keeps a later set with fewer planned reps", next(68, 8, 1, { kg: 68, reps: 6 }), 68);
check("next set: much easier adds one increment", next(68, 8, 4), 72);
check("next set: far below target removes one increment", next(68, 6, 0), 64);
check("next set: without RIR keeps weight", next(68, 8, null), 68);
check("next set: without history may move several steps", next(40, 12, 5, { kg: null, reps: 8 }), 48);

check("finisher: drop set 25% lighter, same reps", finisherSets("drop", 20, 12, db), [{ type: "drop", kg: 12, reps: 12, rir: 0 }]);
check("finisher: myo-reps, three mini-sets of a third", finisherSets("myo", 16, 15, db).map((x) => x.reps), [5, 5, 5]);
check("finisher sets do not steer the plan", brief(planExercise({ ex: db, target, nSets: 2, today, bodyweight: 90,
  history: [{ date: daysAgo(5), sets: [{ kg: 68, reps: 8, rir: 1 }, { kg: 68, reps: 8, rir: 1 }, { kg: 68, reps: 3, rir: 0, type: "myo" }] }] })),
  { mode: "up", kg: [72, 72], reps: [5, 5] });
check("finisher sets count half for volume", setCount([{ kg: 1, reps: 1 }, { kg: 1, reps: 1, type: "drop" }, { kg: 1, reps: 1, type: "myo" }]), 2);
check("warm-ups: dumbbell compound", warmupSets(68, db, "compound"), [{ kg: 32, reps: 10 }, { kg: 44, reps: 6 }, { kg: 56, reps: 3 }]);
const bar = { load: "none", increment: 2.5, equipment: "barbell" };
check("warm-ups: barbell starts at the empty bar", warmupSets(30, bar, "compound"), [{ kg: 20, reps: 10 }, { kg: 25, reps: 3 }]);
check("warm-ups: isolation", warmupSets(20, db, "isolation"), [{ kg: 12, reps: 8 }]);
check("warm-ups: none for bodyweight", warmupSets(10, weighted, "compound"), []);

const rotation = ["a", "b"];
check("rotation: starts at the first day", nextTemplateId(rotation, [{ template: "push" }]), "a");
check("rotation: alternates", nextTemplateId(rotation, [{ template: "a" }, { template: "push" }]), "b");
check("rotation: wraps around", nextTemplateId(rotation, [{ template: "b" }]), "a");

const index = indexByExercise([
  { id: "1", start: "2025-01-01T10:00:00", exercises: [{ ex: "x", sets: [{ kg: 10, reps: 5, warmup: true }, { kg: 20, reps: 5 }] }] },
  { id: "2", start: "2025-02-01T10:00:00", exercises: [{ ex: "y", sets: [{ kg: 30, reps: 5 }] }] },
]);
check("index: warm-ups are dropped", index.get("x")[0].sets, [{ kg: 20, reps: 5 }]);

const session = (id, start, sets) => ({ id, start, exercises: [{ ex: "x", sets: sets.map(([kg, reps]) => ({ kg, reps, rir: 1 })) }] });
const prs = sessionRecords([
  session("a", "2026-01-01T10:00:00", [[60, 8], [60, 8]]),
  session("b", "2026-01-08T10:00:00", [[62.5, 8], [62.5, 8]]),
  session("c", "2026-01-15T10:00:00", [[60, 6]]),
], () => db, 90);
check("records: none in the first session", prs.has("a"), false);
check("records: heavier session sets all three", prs.get("b").map((r) => r.kind), ["e1rm", "weight", "volume"]);
check("records: a lighter session sets none", prs.has("c"), false);
const rec = records([{ date: today, sets: [{ kg: 60, reps: 10 }, { kg: 70, reps: 5 }] }], db, 90);
check("records: heaviest weight for at least 6 reps", rec.reps.get(6).value, 60);
check("records: heaviest weight", rec.heaviest.value, 70);

const series = (values) => values.map((e1rm, i) => ({ date: daysAgo(7 * (values.length - i)), e1rm }));
check("stall: no new best in four sessions", stalled(series([100, 102, 104, 105, 104, 105, 103, 104])), true);
check("stall: still improving", stalled(series([100, 102, 104, 105, 104, 105, 106, 104])), false);

const lib = { exercises: new Map([["row", { muscle: "back", pattern: "row" }]]), patterns: new Map([["row", { secondary: [["biceps", 0.5], ["traps", 0.5]] }]]) };
check("muscles: secondary muscles count half", muscleShares("row", lib), [["back", 1], ["biceps", 0.5], ["traps", 0.5]]);
const weeks = weeklyStats([{ start: "2026-10-27T18:00:00", exercises: [{ ex: "row", sets: [{ kg: 50, reps: 10 }, { kg: 50, reps: 10 }] }] }], lib, today, 2);
check("weeks: sets per muscle in the current week", Object.fromEntries(weeks[1].muscles), { back: 2, biceps: 1, traps: 1 });

const csv = `Date,Workout Name,Duration,Exercise Name,Set Order,Weight,Reps,Distance,Seconds,RPE
2026-10-08 15:09:45,"Push, heavy",1h 5m,"Bench Press (Barbell)",W,40.0,10.0,0,0.0,
2026-10-08 15:09:45,"Push, heavy",1h 5m,"Bench Press (Barbell)",1,80.0,6.0,0,0.0,8
2026-10-08 15:09:45,"Push, heavy",1h 5m,"Bench Press (Barbell)",F,80.0,5.0,0,0.0,
2026-10-08 15:09:45,"Push, heavy",1h 5m,"Squat (Barbell)",1,20.0,10.0,0,0.0,
2026-10-08 15:09:45,"Push, heavy",1h 5m,"Squat (Barbell)",2,100.0,5.0,0,0.0,
2026-10-08 15:09:45,"Push, heavy",1h 5m,"Zercher Squat",1,60.0,8.0,0,0.0,
2026-10-08 15:09:45,"Push, heavy",1h 5m,"Zercher Squat",D,40.0,8.0,0,0.0,`;
const libraryForCsv = { exercises: new Map([
  ["bench-press-barbell", { id: "bench-press-barbell", name: "Bench Press (Barbell)", load: "none", aliases: "" }],
  ["squat-barbell", { id: "squat-barbell", name: "Squat (Barbell)", load: "none", aliases: "" }],
]) };
const imported = strongSessions(parseCsv(csv), libraryForCsv);
const s0 = imported.sessions[0];
check("strong: one session with id from its start", [imported.sessions.length, s0.id, s0.start, s0.name, s0.durationMin], [1, "strong-20261008T150945", "2026-10-08T15:09:45", "Push, heavy", 65]);
check("strong: marked warm-up, RPE and failure set", s0.exercises[0].sets, [{ kg: 40, reps: 10, warmup: true }, { kg: 80, reps: 6, rir: 2 }, { kg: 80, reps: 5, rir: 0 }]);
check("strong: unmarked ramp-up set becomes a warm-up", s0.exercises[1].sets.map((x) => Boolean(x.warmup)), [true, false]);
check("strong: unknown names become new exercises", imported.extra.map((e) => e.id), ["custom-zercher-squat"]);
check("strong: drop sets keep their type", s0.exercises[2].sets.map((x) => x.type ?? null), [null, "drop"]);

check("clean: a session id with markup is rejected", cleanSession({ id: '"><img src=x onerror=alert(1)>', start: "2026-01-01T10:00:00", exercises: [] }), null);
const hostile = cleanSession({ id: "a", start: "2026-01-01T10:00:00", name: 7, durationMin: "<i>", exercises: [
  { ex: 'x"><svg onload=alert(1)>', sets: [] }, { ex: "squat-barbell", sets: [{ kg: "<img>", reps: "8<script>", rir: "1" }] }] });
check("clean: bad exercise ids are dropped and numbers converted", hostile.exercises, [{ ex: "squat-barbell", sets: [{ kg: 0, reps: 0, rir: 1 }] }]);
check("clean: text fields get defaults", [hostile.name, hostile.durationMin], ["Workout", null]);
const prog = cleanProgram({ version: 2, split: "ppl", custom: [{ id: "t1", name: "<b>", slots: [{ id: "s1", ex: "dip", sets: 99 }, { id: "s2", ex: "<x>" }] }, { id: "<x>", slots: [] }],
  extra: [{ id: "custom-a", name: "A", muscle: "<script>", load: "add" }], exercises: { "bench-press-barbell": { reps: [4, 6], rir: "x" } } });
check("clean: program templates keep only valid ids", prog.custom, [{ id: "t1", name: "<b>", slots: [{ id: "s1", ex: "dip", sets: 10, superset: false, finisher: "" }] }]);
check("clean: extra exercises get fixed fields", prog.extra[0].muscle + prog.extra[0].load, "othernone");
check("clean: targets keep only valid values", prog.exercises, { "bench-press-barbell": { reps: [4, 6] } });

const pullups = [{ exercises: [{ ex: "pull-up", sets: [{ kg: 0, reps: 8, warmup: true }, { kg: 10, reps: 6 }] }] },
  { exercises: [{ ex: "pull-up", sets: [{ kg: 0, reps: 12 }] }] }];
check("weighted: added weight makes a weighted pull-up", [splitWeighted(pullups).length, pullups.map((s) => s.exercises[0].ex)], [1, ["weighted-pull-up", "pull-up"]]);

const key = await deriveKey("correct horse battery", new Uint8Array(16));
const doc = stable({ b: [1, { d: 2, c: 3 }], a: "x" });
check("sync: stable JSON sorts keys", doc, '{"a":"x","b":[1,{"c":3,"d":2}]}');
check("sync: encrypt and decrypt", await decrypt(key, await encrypt(key, doc)), doc);
const wrong = await deriveKey("wrong horse battery", new Uint8Array(16));
check("sync: a wrong passphrase fails", await decrypt(wrong, await encrypt(key, doc)).then(() => "read", () => "rejected"), "rejected");

const failed = results.filter((r) => r.startsWith("FAIL")).length;
document.getElementById("out").textContent = `${failed ? "FAILED" : "ALL PASSED"} ${results.length - failed}/${results.length}\n` + results.join("\n");
</script>
